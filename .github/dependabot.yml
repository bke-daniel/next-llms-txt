version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
    open-pull-requests-limit: 10
    reviewers:
      - "bke-daniel"
    assignees:
      - "bke-daniel"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    # Group all minor and patch updates together
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # The toolchain (tsup dts build, typescript-eslint, which supports
      # <6.1.0) needs the TypeScript 6.0 compiler API. TypeScript 7 support is
      # covered by the typescript-compat job in the Test workflow instead.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # @types/node follows the Node.js major in .nvmrc (24), so its types never
      # describe APIs the runtime does not have.
      - dependency-name: "@types/node"
        versions: ["<24.0.0", ">=25.0.0"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "ci"
    labels:
      - "github-actions"
      - "automated"
